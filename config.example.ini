# CursorBeacon 示例配置
# 复制到 %APPDATA%\CursorBeacon\config.ini 后修改，重启服务生效。

enabled=true
max_scale=4
sensitivity=5
hold_ms=800
grow_tau_ms=60
shrink_tau_ms=180
update_hz=30

# auto / rawinput / polling（当前实现自动选择，字段保留）
sampling_mode=auto

# Arrow,IBeam,Hand,Crosshair 或 all
cursor_set=Arrow,IBeam,Hand,Crosshair

pause_on_fullscreen=true
pause_on_click=true
